<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My 90s Book Webpage</title>
  <style>
    body {
      background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
      font-family: 'Courier New', Courier, monospace;
      color: #2e3b4e;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 600px;
      margin: 50px auto;
      background: #fffaf6;
      border: 4px solid #ffc0cb;
      border-radius: 15px;
      box-shadow: 0 0 12px #ecb3ff;
      padding: 30px;
      text-align: center;
    }
    h1, h2 {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #ff69b4;
      text-shadow: 2px 2px 0 #fff2b2;
    }
    .divider {
      border-top: 3px dashed #90caf9;
      margin: 20px 0;
    }
    .book-cover {
      border: 3px solid #90caf9;
      border-radius: 8px;
      margin-bottom: 20px;
      width: 200px;
      height: 270px;
      background: #e7ffde;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .btn {
      background: linear-gradient(90deg, #ffb6c1 0%, #87cefa 100%);
      color: #2e3b4e;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      padding: 12px 25px;
      cursor: pointer;
      box-shadow: 0 2px 8px #ffd6d9;
      margin-top: 20px;
    }
    .btn:hover {
      background: linear-gradient(90deg, #fff2b2 0%, #ecb3ff 100%);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Book Title</h1>
    <div class="book-cover">
      <!-- Placeholder: You can add an image here -->
      <span style="margin-top: 120px; display: block; color: #90caf9;">Book Cover Placeholder</span>
    </div>
    <h2>by Your Name</h2>
    <div class="divider"></div>
    <h2>About the Book</h2>
    <p>
      Lorem ipsum dolor sit amet, consectetur adipiscing elit. This is where you can write a cute introduction about your book!
    </p>
    <div class="divider"></div>
    <h2>Favourite Characters</h2>
    <ul style="list-style-type: square; color: #ff69b4;">
      <li>Character One</li>
      <li>Character Two</li>
      <li>Character Three</li>
    </ul>
    <button class="btn">Read More</button>
  </div>
</body>
</html>
